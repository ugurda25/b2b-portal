<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uğur Giyim - Yönetici Portalı</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div id="dashboard-container" style="display: flex;">
        <!-- Sol Yan Menü (Sidebar) - index.html İle Birebir Aynı Tasarım -->
        <div class="sidebar bg-dark text-white p-3 shadow">
            <div class="text-center py-2 border-bottom border-secondary mb-3">
                <h3 class="font-weight-bold text-uppercase text-warning mb-0 text-center">Uğur Giyim</h3>
                <small class="text-muted">B2B Yönetim Portalı</small>
            </div>

            <div class="card bg-secondary text-white border-0 mb-3 p-2 text-center"
                style="background-color: #2c3034 !important;">
                <small class="text-white d-block">Hoş Geldiniz</small>
                <strong id="user-display" class="text-truncate d-block">Yönetici</strong>
                <div>
                    <span id="role-display" class="badge badge-danger font-weight-bold mt-1">YÖNETİCİ</span>
                </div>
            </div>

            <div id="admin-menu">
                <h5 class="text-uppercase font-weight-bold px-2 text-center py-3">Yönetici İşlemleri</h5>
                <ul class="nav nav-pills flex-column mt-1 mb-3">
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left active" id="menu-admin-dashboard">
                            <i class="fa-solid fa-chart-pie mr-2 py-2"></i> Genel Bakış (Dashboard)
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-admin-products">
                            <i class="fa-solid fa-boxes-stacked mr-2 py-2"></i> Ürün & Stok Yönetimi
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-admin-orders">
                            <i class="fa-solid fa-truck-ramp-box mr-2 py-2"></i> Sipariş & Sevkiyat
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-admin-dealers">
                            <i class="fa-solid fa-users-gear mr-2 py-2"></i> Bayi & Cari Hesaplar
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-admin-recurring">
                            <i class="fa-solid fa-arrows-rotate mr-2 py-2"></i> Otomatik Siparişler
                        </button>
                    </li>
                </ul>
                <div class="mt-3 pt-3">
                    <button class="btn btn-danger btn-block text-left" style="margin-top: 85px; border-radius: 10px;"
                        id="menu-logout">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Çıkış Yap
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sağ Ana İçerik - index.html İle Birebir Aynı Üst Bar Yapısı -->
    <div class="main-content p-4">
        <div class="row align-items-center mb-4 pb-3 border-bottom">
            <div class="col-md-7">
                <button class="font-weight-bold text-dark mb-0 btn-block btn text-left p-0" id="section-title"
                    style="font-size: 24px; cursor: default;">
                    <i class="fa-solid fa-chart-pie mr-2 text-warning"></i> Genel Bakış & Metrikler
                </button>
                <small class="text-muted" id="section-subtitle">Sistem genel durumu, satış istatistikleri ve kritik stoklar</small>
            </div>

            <!-- SAĞ ÜST BUTONLAR: BAYİYE GEÇ & YENİLE -->
            <div class="col-md-5 text-right">
                <button class="btn btn-outline-primary btn-sm font-weight-bold shadow-sm" id="btnRefresh">
                    <i class="fa-solid fa-rotate mr-1"></i> Yenile
                </button>
            </div>
        </div>

        <!-- Dinamik İçerik Alanı -->
        <div class="row" id="content-area"></div>
    </div>

    <!-- Kütüphaneler (index.html ile birebir aynı) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script type="module" src="js/adminMain.js"></script>
</body>

</html>
