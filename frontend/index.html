<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uğur Giyim - B2B Portalı</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-light">
    <!-- GİRİŞ EKRANI (LOGIN) -->
    <div id="login-container" class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-5">
                <div class="card shadow-lg border-0" style="border-radius: 15px;">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="font-weight-bold text-dark text-uppercase mb-1">Uğur Giyim</h2>
                            <span class="badge badge-warning text-dark px-3 py-1 font-weight-bold">B2B BAYİ
                                PORTALI</span>
                            <p class="text-muted small mt-2">Lütfen bayi hesabınıza giriş yapınız.</p>
                        </div>

                        <form id="form-login">
                            <div class="form-group">
                                <label class="small font-weight-bold">Bayi E-Posta / Kodu</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-light"><i
                                                class="fa-solid fa-user text-muted"></i></span>
                                    </div>
                                    <input type="text" id="loginUsername" class="form-control"
                                        placeholder="E-Postanızı giriniz" required>
                                </div>
                            </div>

                            <div class="form-group mb-4">
                                <label class="small font-weight-bold">Şifre</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-light"><i
                                                class="fa-solid fa-lock text-muted"></i></span>
                                    </div>
                                    <input type="password" id="loginPassword" class="form-control"
                                        placeholder="Şifrenizi Giriniz" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-dark btn-block font-weight-bold py-2 shadow-sm">
                                <i class="fa-solid fa-right-to-bracket mr-2"></i> Giriş Yap
                            </button>
                            <button type="button" class="btn btn-link btn-block btn-sm text-muted mt-2"
                                id="btn-forgot-password">
                                <i class="fa-solid fa-key mr-1"></i> Şifremi Unuttum
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ANA PANEL / DASHBOARD -->
    <div id="dashboard-container" style="display: none;">
        <!-- Sol Yan Menü (Sidebar) -->
        <div class="sidebar bg-dark text-white p-3 shadow">
            <div class="text-center py-2 border-bottom border-secondary mb-3">
                <h3 class="font-weight-bold text-uppercase text-warning mb-0 text-center">Uğur Giyim</h3>
                <small class="text-muted">B2B Yönetim Portalı</small>
            </div>

            <div class="card bg-secondary text-white border-0 mb-3 p-2 text-center"
                style="background-color: #2c3034 !important;">
                <small class="text-white d-block">Hoş Geldiniz</small>
                <strong id="user-display" class="text-truncate d-block">------</strong>
                <div>
                    <span id="role-display" class="badge badge-warning font-weight-bold mt-1">BAYİ</span>
                </div>
            </div>

            <div id="bayi-menu">
                <h5 class="text-uppercase font-weight-bold px-2 text-center py-3">Bayi İşlemleri</h5>
                <ul class="nav nav-pills flex-column mt-1 mb-3 ">
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-products">
                            <i class="fa-solid fa-box-open mr-2 py-2"></i> Ürün Kataloğu
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-orders">
                            <i class="fa-solid fa-receipt mr-2 py-2"></i> Sipariş Geçmişi
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-recurring">
                            <i class="fa-solid fa-arrows-rotate mr-2 py-2"></i> Otomatik Siparişler
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-balance">
                            <i class="fa-solid fa-wallet mr-2 py-2"></i> Cari Hesap & Bakiye
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-loyalty">
                            <i class="fa-solid fa-star mr-2 text-warning py-2"></i> Sadakat & İskonto
                        </button>
                    </li>
                    <li class="nav-item mb-1">
                        <button class="btn btn-outline-light btn-block text-left" id="menu-settings">
                            <i class="fa-solid fa-gear mr-2 py-2"></i> Hesap Ayarları
                        </button>
                    </li>
                </ul>
                <div class="mt-3 pt-3">
                    <button class="btn btn-danger btn-block text-left" style="margin-top: 85px; border-radius: 10px;"
                        id="menu-logout">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Çıkış Yap
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sağ Ana İçerik -->
    <div class="main-content p-4" style="display: none;">
        <div class="row align-items-center mb-4 pb-3 border-bottom">
            <div class="col-md-4">
                <button class="font-weight-bold text-dark mb-0 btn-block btn text-left" id="section-title"
                    style="font-size: 24px;">
                    <i class="fa-solid mr-2"></i> Ürün Kataloğu
                </button>
                <small class="text-muted">Toptan ürün listesi ve stok durumu</small>
            </div>
            <div class="col-md-5">
                <div class="input-group shadow-sm">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-white border-right-0">
                            <i class="fa-solid fa-magnifying-glass text-muted"></i>
                        </span>
                    </div>
                    <input type="text" id="searchProduct" class="form-control border-left-0"
                        placeholder="Ürün Adı, Barkod ara...">
                </div>
            </div>

            <!-- SAĞ ÜST BUTONLAR: SEPET VE YENİLE -->
            <div class="col-md-3 text-right">
                <button class="btn btn-dark btn-sm font-weight-bold shadow-sm mr-1" data-toggle="modal"
                    data-target="#cartModal" id="btnOpenCart">
                    <i class="fa-solid fa-cart-shopping mr-1"></i> Sepetim
                    <span class="badge badge-warning text-dark ml-1" id="cartBadge">0</span>
                </button>
                <button class="btn btn-outline-primary btn-sm font-weight-bold shadow-sm" id="btnRefresh">
                    <i class="fa-solid fa-rotate mr-1"></i> Yenile
                </button>
            </div>
        </div>

        <!-- Ürün Kartları Alanı -->
        <div class="row" id="content-area"></div>
    </div>

    <!-- SADE SEPET MODAL -->
    <div class="modal fade" id="cartModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title font-weight-bold">Sepetim</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <ul class="list-group mb-3" id="cartList">
                        <li class="list-group-item text-center text-muted">Sepetiniz boş.</li>
                    </ul>
                    <div class="d-flex justify-content-between align-items-center">
                        <strong>Genel Toplam:</strong>
                        <h4 class="text-primary font-weight-bold mb-0" id="cartTotal">0.00 ₺</h4>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Kapat</button>
                    <button type="button" class="btn btn-success font-weight-bold" id="btnOrder">Sipariş Ver</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Kütüphaneler -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>

</html>
