spring.application.name=b2b-portal
# Uğur Giyim MSSQL Veritabanı Bağlantısı (Docker localhost:1433)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=B2B_Project_DB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Arka planda çalışan SQL sorgularını konsolda görmek için
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Boot'un özenle tasarladığımız tabloları bozmasını engelliyoruz
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.error.include-message=always

# Sunumda 30 saniyelik tekrar icin true, haftalik pazartesi duzeni icin false yapin.
recurring-order.demo-mode=false

